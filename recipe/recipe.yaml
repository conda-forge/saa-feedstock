schema_version: 1

context:
  name: saa
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/saa-${{ version }}.tar.gz
  sha256: 69006802e71a9e087aaafd82a46b12eced02ed6a7a595c47ebfd17815064347f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.11.15,<0.12
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - saa
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Converting time into natural language phrases
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Proteusiq/saa

extra:
  recipe-maintainers:
    - thewchan
